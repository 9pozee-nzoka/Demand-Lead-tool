; ─────────────────────────────────────────────────────────────────────────────
; DemandLead — Supervisor queue worker configuration
;
; Installation:
;   sudo cp demand-lead-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start demand-lead-*
;
; Logs are in /var/log/demand-lead/
; ─────────────────────────────────────────────────────────────────────────────

; ── Default / high-priority queue (general processing) ───────────────────────
[program:demand-lead-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/demand-lead/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/demand-lead/worker-default.log
stopwaitsecs=3600

; ── Ingestion queue — Google Trends data collection ──────────────────────────
[program:demand-lead-ingestion]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/demand-lead/artisan queue:work redis --queue=ingestion --sleep=5 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
; Single worker per queue to avoid Google Trends rate limits
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/demand-lead/worker-ingestion.log
stopwaitsecs=3600

; ── Processing queue — baseline + growth computation ─────────────────────────
[program:demand-lead-processing]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/demand-lead/artisan queue:work redis --queue=processing --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/demand-lead/worker-processing.log
stopwaitsecs=3600

; ── Scoring queue — opportunity score calculation ─────────────────────────────
[program:demand-lead-scoring]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/demand-lead/artisan queue:work redis --queue=scoring --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/demand-lead/worker-scoring.log
stopwaitsecs=3600

; ── Notifications queue — alerts and email delivery ──────────────────────────
[program:demand-lead-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/demand-lead/artisan queue:work redis --queue=notifications --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/demand-lead/worker-notifications.log
stopwaitsecs=3600

; ── Lead workflows queue — QualifyLead and lead scoring ──────────────────────
[program:demand-lead-lead-workflows]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/demand-lead/artisan queue:work redis --queue=lead_workflows --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/demand-lead/worker-lead-workflows.log
stopwaitsecs=3600

; ── Group all workers together ────────────────────────────────────────────────
[group:demand-lead]
programs=demand-lead-default,demand-lead-ingestion,demand-lead-processing,demand-lead-scoring,demand-lead-notifications,demand-lead-lead-workflows
