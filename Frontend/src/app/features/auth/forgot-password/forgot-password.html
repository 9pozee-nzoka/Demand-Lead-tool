<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="auth-card__logo">📡</span>
      <h1 class="auth-card__title">Reset your password</h1>
      <p class="auth-card__subtitle">We'll send a reset link to your email</p>
    </div>

    @if (sent()) {
      <div class="auth-card__alert">
        <span class="material-symbols-rounded">mark_email_read</span>
        If that email exists, a reset link has been sent. Check your inbox.
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-field">
          <label class="form-label" for="fp_email">Email address</label>
          <input id="fp_email" type="email" class="form-input"
            [class.form-input--error]="email.invalid && email.touched"
            formControlName="email" placeholder="you@company.com" autocomplete="email" />
          @if (email.invalid && email.touched) {
            <span class="form-error">Enter a valid email address.</span>
          }
        </div>
        <button type="submit" class="btn btn--primary btn--full" [disabled]="loading()">
          @if (loading()) { <span class="btn__spinner"></span> Sending… }
          @else { Send reset link }
        </button>
      </form>
    }

    <p class="auth-card__footer">
      <a routerLink="/login">← Back to sign in</a>
    </p>
  </div>
</div>
