<div class="auth-page">
  <div class="auth-card">
    <!-- Brand -->
    <div class="auth-card__brand">
      <span class="auth-card__logo">📡</span>
      <h1 class="auth-card__title">DemandLead</h1>
      <p class="auth-card__subtitle">AI Demand Intelligence Platform</p>
    </div>

    @if (sessionMsg()) {
      <div class="auth-card__alert">
        <span class="material-symbols-rounded">info</span>
        {{ sessionMsg() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <!-- Email -->
      <div class="form-field">
        <label class="form-label" for="email">Email address</label>
        <input
          id="email"
          type="email"
          class="form-input"
          [class.form-input--error]="email.invalid && email.touched"
          formControlName="email"
          autocomplete="email"
          placeholder="you@company.com"
        />
        @if (email.invalid && email.touched) {
          <span class="form-error">Enter a valid email address.</span>
        }
      </div>

      <!-- Password -->
      <div class="form-field">
        <label class="form-label" for="password">
          Password
          <a routerLink="/forgot-password" class="form-label__link">Forgot?</a>
        </label>
        <div class="form-input-wrap">
          <input
            id="password"
            [type]="showPass() ? 'text' : 'password'"
            class="form-input"
            [class.form-input--error]="password.invalid && password.touched"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button type="button" class="form-input-wrap__toggle" (click)="showPass.update(v => !v)" aria-label="Toggle password">
            <span class="material-symbols-rounded">{{ showPass() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        @if (password.invalid && password.touched) {
          <span class="form-error">Password is required.</span>
        }
      </div>

      <button type="submit" class="btn btn--primary btn--full" [disabled]="loading()">
        @if (loading()) {
          <span class="btn__spinner"></span> Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="auth-card__footer">
      Don't have an account?
      <a routerLink="/register">Create one free</a>
    </p>
  </div>
</div>
