<app-page-header title="Team" subtitle="Manage users and their roles">
  <button class="btn btn--primary">
    <span class="material-symbols-rounded">person_add</span> Invite user
  </button>
</app-page-header>

@if (loading()) {
  <app-loading-spinner [full]="true" />
} @else if (users().length === 0) {
  <app-empty-state icon="group" title="No team members yet" />
} @else {
  <div class="table-wrap card">
    <table class="data-table">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr>
      </thead>
      <tbody>
        @for (u of users(); track u.id) {
          <tr>
            <td class="font-medium">{{ u.name }}</td>
            <td class="text-sm text-muted">{{ u.email }}</td>
            <td><app-badge [variant]="roleVariant(u.role)">{{ u.role }}</app-badge></td>
            <td><app-badge [variant]="u.status === 'active' ? 'success' : 'neutral'">{{ u.status }}</app-badge></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
