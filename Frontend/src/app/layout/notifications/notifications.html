<div class="toast-container" aria-live="polite">
  @for (n of notify.items(); track n.id) {
    <div class="toast" [ngClass]="'toast--' + n.type" role="alert">
      <span class="toast__icon material-symbols-rounded">
        @switch (n.type) {
          @case ('success') { check_circle }
          @case ('error')   { error }
          @case ('warning') { warning }
          @default          { info }
        }
      </span>
      <span class="toast__message">{{ n.message }}</span>
      <button class="toast__close" (click)="notify.remove(n.id)" aria-label="Dismiss">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
  }
</div>
