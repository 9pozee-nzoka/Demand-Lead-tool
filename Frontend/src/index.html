<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DemandLead — AI Demand Intelligence</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AI Demand Intelligence Platform — detect rising market demand, generate leads and measure revenue." />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- Preconnect to Google Fonts for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Inter font — display=swap prevents FOIT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Material Symbols Rounded — preload with display=block to avoid FOUT flash -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block"
    rel="stylesheet"
  />

  <style>
    /*
     * Critical CSS — prevents layout flash before Angular bootstraps.
     * Keeps body invisible for max 300ms, then shows regardless.
     */
    body {
      visibility: hidden;
      background: #f8fafc;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body.fonts-loaded {
      visibility: visible;
    }
    /* Ensure icons never render as oversized text during load */
    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded', sans-serif;
      font-size: 20px;
      font-style: normal;
      font-weight: normal;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      visibility: inherit;
    }
  </style>
</head>
<body>
  <app-root></app-root>

  <script>
    // Show body once fonts are ready (or after 300ms max)
    if (document.fonts) {
      document.fonts.ready.then(() => document.body.classList.add('fonts-loaded'));
    } else {
      document.body.classList.add('fonts-loaded');
    }
    setTimeout(() => document.body.classList.add('fonts-loaded'), 300);
  </script>
</body>
</html>
